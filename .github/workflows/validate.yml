name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate entries
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -n "$BASE" ]; then
            node scripts/validate.mjs --base "$BASE" --author "$AUTHOR"
          else
            node scripts/validate.mjs
          fi
